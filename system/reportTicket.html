	<script>
		function ajustarPaginaTicket58(){
			if(!document.body.classList.contains("ticket-termico-58")){ return; }
			// CSS no admite size:58mm auto. Medir el contenido ya cargado
			// evita cortar recibos largos o desperdiciar una hoja de altura fija.
			var alto = Math.ceil(document.querySelector("form").getBoundingClientRect().height * 25.4 / 96) + 2;
			var estilo = document.getElementById("pagina-ticket-58");
			if(!estilo){
				estilo = document.createElement("style");
				estilo.id = "pagina-ticket-58";
				document.head.appendChild(estilo);
			}
			estilo.textContent = "@page ticket58 { size:58mm "+Math.max(30, alto)+"mm; margin:0; }";
		}
		window.addEventListener("beforeprint", ajustarPaginaTicket58);

	 window.onload=function()

		{
			var pagina=localStorage.getItem("reporte");
			var tipo=localStorage.getItem("tipo");
			document.getElementById("divimpr").innerHTML=pagina
			if(document.querySelector("#divimpr .divTicket")){
				document.documentElement.classList.add("ticket-termico-58");
				document.body.classList.add("ticket-termico-58");
			}
			if(typeof configurarFormatoTicket58 === "function"){ configurarFormatoTicket58(); }
			if(tipo=="factura" || tipo=='ticket'){
				var imagenes = document.getElementById("divimpr").querySelectorAll("img");
				Promise.all(Array.prototype.map.call(imagenes, function(imagen){
					return new Promise(function(resolve){
						if(imagen.complete){
							resolve();
							return;
						}
						imagen.addEventListener("load", resolve, {once:true});
						imagen.addEventListener("error", resolve, {once:true});
					});
				})).then(function(){
					if(typeof prepararLogoTicket58 === "function"){ return prepararLogoTicket58(); }
				}).then(function(){
					return document.fonts ? document.fonts.ready : Promise.resolve();
				}).then(function(){
					ajustarPaginaTicket58();
					window.print();
				});
          
			}

    }

	
	
		function utf8_to_b64( str ) {
  return window.btoa(unescape(encodeURIComponent( str )));
}

function b64_to_utf8( str ) {
  return decodeURIComponent(escape(window.atob( str )));
}
	function obtener_datos(datos)
		{
		
   var loc = datos;
   if (loc.indexOf('?')>0)
   {
   
   var getstring = loc.split('?')[1];
   var GET= getstring.split('&');
   var get ={};
  
   for (var i =0, l = GET.length; i < l;i++)
   {
   var tmp = GET[i].split('=');
   get[tmp[0]]= unescape(decodeURI(tmp[1]));
   
   }
   return get;
   }
	}
	
	function buscar_datos_url_usuario(datos){
		try{
			valores = document.location.href;
		 valores = obtener_datos(valores);
		 var  datos=valores[datos];
		 return datos;
		}catch(error){
		return "";
		}
		 
	}
	
	</script>
